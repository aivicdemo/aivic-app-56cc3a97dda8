window.AIVIC_API_URL = "https://mkwmoife37uqyv4zhy4yhweozq0oddxn.lambda-url.us-east-1.on.aws/";
window.AIVIC_APP_ID = "session-1780371834361";

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentData = [];\n  let filteredData = [];\n  let currentPage = 1;\n  let itemsPerPage = 20;\n\n  // ステータスバッジのスタイル\n  function getStatusBadge(status) {\n    const styles = {\n      '企画中': 'background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3);',\n      '開発中': 'background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3);',\n      'テスト中': 'background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3);',\n      'リリース済み': 'background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3);',\n      '保守運用': 'background: rgba(107, 114, 128, 0.15); color: #6b7280; border: 1px solid rgba(107, 114, 128, 0.3);'\n    };\n    const style = styles[status] || styles['企画中'];\n    return `<span class=\"px-2 py-1 text-xs rounded-full\" style=\"${style}\">${status || '-'}</span>`;\n  }\n\n  // 優先度バッジのスタイル\n  function getPriorityBadge(priority) {\n    const styles = {\n      '高': 'background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);',\n      '中': 'background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3);',\n      '低': 'background: rgba(107, 114, 128, 0.15); color: #6b7280; border: 1px solid rgba(107, 114, 128, 0.3);'\n    };\n    const style = styles[priority] || styles['中'];\n    return `<span class=\"px-2 py-1 text-xs rounded-full\" style=\"${style}\">${priority || '-'}</span>`;\n  }\n\n  // 進捗バーの生成\n  function getProgressBar(progress) {\n    const percent = Math.min(100, Math.max(0, progress || 0));\n    const color = percent >= 80 ? '#22c55e' : percent >= 50 ? '#f59e0b' : '#ef4444';\n    return `\n      <div class=\"w-full bg-gray-200 rounded-full h-2\" style=\"background: rgba(255,255,255,0.1);\">\n        <div class=\"h-2 rounded-full\" style=\"width: ${percent}%; background: ${color};\"></div>\n      </div>\n      <span class=\"text-xs mt-1\" style=\"color: var(--text-muted);\">${percent}%</span>\n    `;\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    const tbody = container.querySelector('#project-tbody');\n    if (!rows || rows.length === 0) {\n      tbody.innerHTML = `\n        <tr>\n          <td colspan=\"8\" class=\"px-4 py-8 text-center\" style=\"color: var(--text-muted);\">\n            データがありません\n          </td>\n        </tr>\n      `;\n      return;\n    }\n\n    tbody.innerHTML = rows.map(row => `\n      <tr data-id=\"${row.id}\" class=\"border-b cursor-pointer hover:bg-opacity-50\" \n          style=\"border-color: rgba(255,255,255,0.08);\" \n          onmouseover=\"this.style.background='rgba(255,255,255,0.05)'\" \n          onmouseout=\"this.style.background='transparent'\">\n        <td class=\"px-4 py-3\">\n          <div>\n            <div class=\"font-medium text-sm\" style=\"color: var(--text);\">${row.project_name || row.name || '-'}</div>\n            <div class=\"text-xs\" style=\"color: var(--text-muted);\">${row.description || ''}</div>\n          </div>\n        </td>\n        <td class=\"px-4 py-3\">${getStatusBadge(row.status)}</td>\n        <td class=\"px-4 py-3\">${getPriorityBadge(row.priority)}</td>\n        <td class=\"px-4 py-3\">\n          <div class=\"text-sm\" style=\"color: var(--text);\">${row.assignee || row.担当者 || '-'}</div>\n        </td>\n        <td class=\"px-4 py-3\">\n          <div class=\"w-20\">\n            ${getProgressBar(row.progress || row.進捗率)}\n          </div>\n        </td>\n        <td class=\"px-4 py-3\">\n          <div class=\"text-sm\" style=\"color: var(--text);\">${row.start_date || row.開始日 || '-'}</div>\n        </td>\n        <td class=\"px-4 py-3\">\n          <div class=\"text-sm\" style=\"color: var(--text);\">${row.end_date || row.終了予定日 || '-'}</div>\n        </td>\n        <td class=\"px-4 py-3 text-center\">\n          <div class=\"flex items-center justify-center gap-2\">\n            <button class=\"action-btn secondary edit-btn text-xs px-2 py-1\" \n                    data-id=\"${row.id}\"\n                    style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;\">\n              編集\n            </button>\n            <button class=\"action-btn secondary delete-btn text-xs px-2 py-1\" \n                    data-id=\"${row.id}\"\n                    style=\"background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 4px;\">\n              削除\n            </button>\n          </div>\n        </td>\n      </tr>\n    `).join('');\n\n    // 結果件数の更新\n    container.querySelector('#result-count').textContent = rows.length;\n  }\n\n  // 統計情報の更新\n  function updateStats(data) {\n    const stats = {\n      planning: data.filter(r => r.status === '企画中').length,\n      developing: data.filter(r => r.status === '開発中').length,\n      released: data.filter(r => r.status === 'リリース済み').length\n    };\n    \n    container.querySelector('#stat-planning').textContent = stats.planning;\n    container.querySelector('#stat-developing').textContent = stats.developing;\n    container.querySelector('#stat-released').textContent = stats.released;\n  }\n\n  // フィルタリング処理\n  function applyFilters() {\n    const keyword = container.querySelector('#input-search').value.toLowerCase();\n    const status = container.querySelector('#status-filter').value;\n    const priority = container.querySelector('#priority-filter').value;\n    const assignee = container.querySelector('#assignee-filter').value;\n\n    filteredData = currentData.filter(row => {\n      const matchKeyword = !keyword || \n        (row.project_name || row.name || '').toLowerCase().includes(keyword) ||\n        (row.description || '').toLowerCase().includes(keyword);\n      \n      const matchStatus = !status || row.status === status;\n      const matchPriority = !priority || row.priority === priority;\n      const matchAssignee = !assignee || (row.assignee || row.担当者) === assignee;\n\n      return matchKeyword && matchStatus && matchPriority && matchAssignee;\n    });\n\n    // ソート適用\n    applySorting();\n    updateStats(filteredData);\n    renderRows(filteredData);\n  }\n\n  // ソート処理\n  function applySorting() {\n    const sortValue = container.querySelector('#sort-select').value;\n    \n    filteredData.sort((a, b) => {\n      switch(sortValue) {\n        case 'created_desc':\n          return new Date(b.created_at || b.作成日時 || 0) - new Date(a.created_at || a.作成日時 || 0);\n        case 'created_asc':\n          return new Date(a.created_at || a.作成日時 || 0) - new Date(b.created_at || b.作成日時 || 0);\n        case 'name_asc':\n          return (a.project_name || a.name || '').localeCompare(b.project_name || b.name || '');\n        case 'priority_desc':\n          const priorityOrder = { '高': 3, '中': 2, '低': 1 };\n          return (priorityOrder[b.priority] || 0) - (priorityOrder[a.priority] || 0);\n        case 'status_asc':\n          return (a.status || '').localeCompare(b.status || '');\n        default:\n          return 0;\n      }\n    });\n  }\n\n  // CSV エクスポート\n  function exportCSV() {\n    const headers = ['プロジェクト名', 'ステータス', '優先度', '担当者', '進捗率', '開始日', '予定終了日', '説明'];\n    const csvContent = [\n      '\\uFEFF' + headers.join(','),\n      ...filteredData.map(row => [\n        `\"${(row.project_name || row.name || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(row.status || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(row.priority || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(row.assignee || row.担当者 || '').replace(/\"/g, '\"\"')}\"`,\n        row.progress || row.進捗率 || 0,\n        `\"${(row.start_date || row.開始日 || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(row.end_date || row.終了予定日 || '').replace(/\"/g, '\"\"')}\"`,\n        `\"${(row.description || '').replace(/\"/g, '\"\"')}\"`\n      ].join(','))\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `app_development_projects_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 初期データの読み込みと描画\n  if (tables && tables[0] && tables[0].records) {\n    currentData = tables[0].records;\n    filteredData = [...currentData];\n    renderRows(filteredData);\n    updateStats(filteredData);\n  }\n\n  // API からの最新データ取得\n  if (window.aivicApi) {\n    window.aivicApi.list(0).then(rows => {\n      if (rows) {\n        currentData = rows;\n        applyFilters();\n      }\n    });\n  }\n\n  // 検索ボタンのイベントリスナー\n  container.querySelector('#btn-search').addEventListener('click', applyFilters);\n\n  // リセットボタンのイベントリスナー\n  container.querySelector('#btn-reset').addEventListener('click', () => {\n    container.querySelector('#input-search').value = '';\n    container.querySelector('#status-filter').value = '';\n    container.querySelector('#priority-filter').value = '';\n    container.querySelector('#assignee-filter').value = '';\n    applyFilters();\n  });\n\n  // ソート変更のイベントリスナー\n  container.querySelector('#sort-select').addEventListener('change', () => {\n    applySorting();\n    renderRows(filteredData);\n  });\n\n  // CSV エクスポートボタン\n  container.querySelector('#btn-csv-export').addEventListener('click', exportCSV);\n\n  // 新規プロジェクトボタン\n  container.querySelector('#btn-new-project').addEventListener('click', () => {\n    window.showScreen('scr-3');\n  });\n\n  // 行レベル操作のイベントデリゲーション\n  container.addEventListener('click', async (e) => {\n    // 削除ボタン\n    const deleteBtn = e.target.closest('.delete-btn');\n    if (deleteBtn) {\n      if (!confirm('このプロジェクトを削除しますか？')) return;\n      \n      const id = deleteBtn.dataset.id;\n      if (window.aivicApi) {\n        await window.aivicApi.delete(0, id);\n        const rows = await window.aivicApi.list(0);\n        if (rows) {\n          currentData = rows;\n          applyFilters();\n        }\n      }\n      return;\n    }\n\n    // 編集ボタン\n    const editBtn = e.target.closest('.edit-btn');\n    if (editBtn) {\n      window.showScreen('scr-3');\n      return;\n    }\n\n    // 行クリック（詳細表示）\n    const row = e.target.closest('tr[data-id]');\n    if (row && !e.target.closest('button')) {\n      window.showScreen('scr-3');\n    }\n  });\n\n  // Enterキーでの検索\n  container.querySelector('#input-search').addEventListener('keypress', (e) => {\n    if (e.key === 'Enter') {\n      applyFilters();\n    }\n  });\n}";
</script>

th, td { border-bottom:1px solid var(--border); padding:8px 10px; text-align:left; font-size:13px; }
th { color:var(--text); background:var(--bg-sidebar); position:sticky; top:0; font-weight:600; }

@media (max-width:768px) {

}

        <div class="flex items-center gap-2">
          <label class="text-sm" style="color: var(--text-muted);">並び順:</label>
          <select 
            id="sort-select" 
            data-testid="sort-select"
            class="px-2 py-1 text-sm rounded"
            style="background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.18); color: var(--text);"
          >
            <option value="created_desc">作成日時（新しい順）</option>
            <option value="created_asc">作成日時（古い順）</option>
            <option value="name_asc">プロジェクト名（昇順）</option>
            <option value="priority_desc">優先度（高い順）</option>
            <option value="status_asc">ステータス順</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-sm" style="color: var(--text-muted);">表示件数:</label>
          <select 
            id="limit-select" 
            data-testid="limit-select"
            class="px-2 py-1 text-sm rounded"
            style="background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.18); color: var(--text);"
          >
            <option value="20">20件</option>
            <option value="50">50件</option>
            <option value="100">100件</option>
          </select>
        </div>
      </div>
      <div class="text-sm" style="color: var(--text-muted);">
        <span id="result-count">0</span> 件のプロジェクト
      </div>
    </div>

    <!-- データテーブル -->
    <div class="flex-1 overflow-auto">
      <div class="table-wrap">
        <table data-testid="project-list" class="w-full">
          <thead>
            <tr style="background: var(--bg-card);">
              <th class="px-4 py-3 text-left text-sm font-medium" style="color: var(--text);">プロジェクト名</th>
              <th class="px-4 py-3 text-left text-sm font-medium" style="color: var(--text);">ステータス</th>
              <th class="px-4 py-3 text-left text-sm font-medium" style="color: var(--text);">優先度</th>
              <th class="px-4 py-3 text-left text-sm font-medium" style="color: var(--text);">担当者</th>
              <th class="px-4 py-3 text-left text-sm font-medium" style="color: var(--text);">進捗率</th>
              <th class="px-4 py-3 text-left text-sm font-medium" style="color: var(--text);">開始日</th>
              <th class="px-4 py-3 text-left text-sm font-medium" style="color: var(--text);">予定終了日</th>
              <th class="px-4 py-3 text-center text-sm font-medium" style="color: var(--text);">操作</th>
            </tr>
          </thead>
          <tbody id="project-tbody">
            <!-- データは initJs で動的に生成 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- ページネーション -->
    <div class="p-4 border-t flex items-center justify-between" style="background: var(--bg-card); border-color: rgba(255,255,255,0.12);">
      <button 
        id="btn-prev-page" 
        data-testid="prev-page-button"
        class="action-btn secondary"
        style="background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 6px 12px; border-radius: 6px; font-size: 14px;"
        disabled
      >
        前のページ
      </button>
      <div class="flex items-center gap-2">
        <span class="text-sm" style="color: var(--text-muted);">ページ</span>
        <span id="current-page" class="text-sm font-medium" style="color: var(--text);">1</span>
        <span class="text-sm" style="color: var(--text-muted);">/ </span>
        <span id="total-pages" class="text-sm font-medium" style="color: var(--text);">1</span>
      </div>
      <button 
        id="btn-next-page" 
        data-testid="next-page-button"
        class="action-btn secondary"
        style="background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 6px 12px; border-radius: 6px; font-size: 14px;"
        disabled
      >
        次のページ
      </button>
    </div>
  </div>
</div>
    </section>
  </main>
</div>
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
